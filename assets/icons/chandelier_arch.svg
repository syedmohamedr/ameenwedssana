<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%" class="chandelier-arch-svg">
  <defs>
    <linearGradient id="archGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc7"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="50%" stop-color="#ffcc00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Scalloped Vintage Arch -->
  <path d="M20 120 Q120 40 250 35 Q380 40 480 120" fill="none" stroke="url(#archGold)" stroke-width="2"/>
  <path d="M35 125 Q130 50 250 45 Q370 50 465 125" fill="none" stroke="url(#archGold)" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Fairy Lights String -->
  <path d="M50 100 Q150 70 250 65 Q350 70 450 100" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1"/>
  <!-- Glowing Bulbs -->
  <circle cx="90" cy="88" r="3.5" fill="url(#bulbGlow)"/>
  <circle cx="140" cy="78" r="3.5" fill="url(#bulbGlow)"/>
  <circle cx="190" cy="71" r="3.5" fill="url(#bulbGlow)"/>
  <circle cx="310" cy="71" r="3.5" fill="url(#bulbGlow)"/>
  <circle cx="360" cy="78" r="3.5" fill="url(#bulbGlow)"/>
  <circle cx="410" cy="88" r="3.5" fill="url(#bulbGlow)"/>

  <!-- Ornate Center Chandelier -->
  <g class="center-chandelier">
    <line x1="250" y1="0" x2="250" y2="45" stroke="url(#archGold)" stroke-width="1.8"/>
    <!-- Chandelier tier 1 -->
    <path d="M235 52 Q250 48 265 52" fill="none" stroke="url(#archGold)" stroke-width="2"/>
    <!-- Chandelier tier 2 -->
    <path d="M225 65 Q250 58 275 65" fill="none" stroke="url(#archGold)" stroke-width="2.5"/>
    <path d="M220 78 Q250 70 280 78" fill="none" stroke="url(#archGold)" stroke-width="2"/>
    <!-- Hanging crystal drops -->
    <line x1="225" y1="65" x2="225" y2="72" stroke="url(#archGold)" stroke-width="1"/>
    <circle cx="225" cy="74" r="2" fill="url(#bulbGlow)"/>
    <line x1="240" y1="68" x2="240" y2="78" stroke="url(#archGold)" stroke-width="1"/>
    <circle cx="240" cy="80" r="2.5" fill="url(#bulbGlow)"/>
    <line x1="250" y1="70" x2="250" y2="85" stroke="url(#archGold)" stroke-width="1.5"/>
    <polygon points="250,85 253,92 250,98 247,92" fill="url(#bulbGlow)"/>
    <line x1="260" y1="68" x2="260" y2="78" stroke="url(#archGold)" stroke-width="1"/>
    <circle cx="260" cy="80" r="2.5" fill="url(#bulbGlow)"/>
    <line x1="275" y1="65" x2="275" y2="72" stroke="url(#archGold)" stroke-width="1"/>
    <circle cx="275" cy="74" r="2" fill="url(#bulbGlow)"/>
  </g>
</svg>
