<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" class="floral-corner-svg">
  <defs>
    <radialGradient id="roseMaroon" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a62c3e"/>
      <stop offset="60%" stop-color="#6e1322"/>
      <stop offset="100%" stop-color="#420812"/>
    </radialGradient>
    <radialGradient id="roseBlush" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f7dede"/>
      <stop offset="60%" stop-color="#e2a8af"/>
      <stop offset="100%" stop-color="#a35460"/>
    </radialGradient>
    <linearGradient id="leafSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#768a73"/>
      <stop offset="100%" stop-color="#3d4f3b"/>
    </linearGradient>
    <linearGradient id="leafGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="100%" stop-color="#b08d3b"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Golden Scroll Vines -->
    <path d="M0 0 C40 10 90 20 120 70 C140 100 150 140 155 160" fill="none" stroke="url(#leafGold)" stroke-width="1.8"/>
    
    <!-- Leaves -->
    <path d="M40 15 C55 8 70 12 75 25 C65 30 50 28 40 15 Z" fill="url(#leafSage)"/>
    <path d="M85 35 C100 28 115 32 118 45 C108 50 95 48 85 35 Z" fill="url(#leafSage)"/>
    <path d="M110 75 C125 70 138 78 140 90 C130 94 118 90 110 75 Z" fill="url(#leafSage)"/>
    <!-- Gold botanical sprigs -->
    <path d="M25 35 Q40 45 42 60 Q32 55 25 35 Z" fill="url(#leafGold)"/>
    <path d="M60 50 Q75 62 76 75 Q68 70 60 50 Z" fill="url(#leafGold)"/>

    <!-- Large Deep Maroon Rose -->
    <g transform="translate(35, 35)">
      <circle cx="0" cy="0" r="28" fill="url(#roseMaroon)"/>
      <!-- Petals overlay -->
      <path d="M-15 -10 C-10 -25 10 -25 15 -10 C25 0 15 15 0 20 C-15 15 -25 0 -15 -10 Z" fill="none" stroke="#851d2e" stroke-width="2"/>
      <circle cx="0" cy="0" r="16" fill="#5c101c"/>
      <circle cx="-3" cy="-3" r="8" fill="#7d1727"/>
      <circle cx="0" cy="0" r="4" fill="#3b0811"/>
    </g>

    <!-- Blush Pink Rose -->
    <g transform="translate(85, 25)">
      <circle cx="0" cy="0" r="20" fill="url(#roseBlush)"/>
      <circle cx="0" cy="0" r="11" fill="#d18a93"/>
      <circle cx="-2" cy="-2" r="5" fill="#8f3a47"/>
    </g>

    <!-- Small Rosebud -->
    <g transform="translate(18, 80)">
      <circle cx="0" cy="0" r="14" fill="url(#roseMaroon)"/>
      <circle cx="0" cy="0" r="7" fill="#4d0b16"/>
    </g>
  </g>
</svg>
