<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 240" width="100%" height="100%" class="lantern-svg">
  <defs>
    <linearGradient id="lanternGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#735108"/>
    </linearGradient>
    <radialGradient id="lanternGlowGrad" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#ffe699" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffb833" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#ff9900" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="lanternGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hanging Chain -->
  <line x1="50" y1="0" x2="50" y2="70" stroke="url(#lanternGoldGrad)" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="50" cy="72" r="3.5" fill="url(#lanternGoldGrad)"/>

  <!-- Lantern Top Finial & Dome -->
  <path d="M50 74 L52 82 L48 82 Z" fill="url(#lanternGoldGrad)"/>
  <path d="M36 94 C36 84 42 82 50 82 C58 82 64 84 64 94 Z" fill="url(#lanternGoldGrad)"/>

  <!-- Inner Warm Glowing Light -->
  <circle cx="50" cy="120" r="32" fill="url(#lanternGlowGrad)" filter="url(#lanternGlow)" class="lantern-light-flicker"/>

  <!-- Lantern Glass Body & Gold Frame -->
  <polygon points="36,94 64,94 72,120 62,150 38,150 28,120" fill="rgba(255, 230, 160, 0.25)" stroke="url(#lanternGoldGrad)" stroke-width="2.5"/>

  <!-- Filigree Openwork Lattice -->
  <line x1="50" y1="94" x2="50" y2="150" stroke="url(#lanternGoldGrad)" stroke-width="1.8"/>
  <line x1="28" y1="120" x2="72" y2="120" stroke="url(#lanternGoldGrad)" stroke-width="1.8"/>
  <path d="M36 94 Q50 120 62 150" fill="none" stroke="url(#lanternGoldGrad)" stroke-width="1.2" opacity="0.8"/>
  <path d="M64 94 Q50 120 38 150" fill="none" stroke="url(#lanternGoldGrad)" stroke-width="1.2" opacity="0.8"/>

  <!-- Candle Flame inside -->
  <ellipse cx="50" cy="122" rx="3.5" ry="7" fill="#fffbe6"/>
  <ellipse cx="50" cy="124" rx="2" ry="4" fill="#ffaa00"/>

  <!-- Bottom Base & Pendant Drop -->
  <path d="M38 150 L62 150 L56 160 L44 160 Z" fill="url(#lanternGoldGrad)"/>
  <circle cx="50" cy="164" r="2.5" fill="url(#lanternGoldGrad)"/>
  <path d="M50 166 L50 178" stroke="url(#lanternGoldGrad)" stroke-width="2"/>
  <circle cx="50" cy="180" r="3.5" fill="url(#lanternGoldGrad)"/>
</svg>
